[package]
name = "librespot-server"
version = "0.3.0"
edition = "2021"
description = "Headless Spotify Connect daemon with REST API, WebSocket event stream, metadata cache, and FIFO audio sink"
license = "MIT"
default-run = "librespot-server"

[[bin]]
name = "librespot-server"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
librespot-core = { git = "https://github.com/librespot-org/librespot.git" }
librespot-playback = { git = "https://github.com/librespot-org/librespot.git", default-features = true }
librespot-discovery = { git = "https://github.com/librespot-org/librespot.git" }
librespot-protocol = { git = "https://github.com/librespot-org/librespot.git" }
librespot-metadata = { git = "https://github.com/librespot-org/librespot.git" }
librespot-oauth = { git = "https://github.com/librespot-org/librespot.git" }
librespot-connect = { git = "https://github.com/librespot-org/librespot.git" }
axum = { version = "0.8", features = ["ws"] }
utoipa = { version = "6", features = ["axum_extras"] }
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
futures-util = "0.3"
ctrlc = "3.4"
protobuf = "3.7"
rand = "0.9"
form_urlencoded = "1.2"
log = "0.4"
sha1 = "0.11"
hex = "0.4"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3.10"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
